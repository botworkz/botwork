[package]
name = "botwork-ui-wasm"
version = "0.0.0"
edition = "2021"
publish = false

# `cdylib` is required by wasm-bindgen's WASM glue; `rlib` lets the
# test harness import the crate as a library (currently unused; kept
# symmetric with the rest of the leptos-csr crates in the org).
[lib]
name = "botwork_ui_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos 0.8 CSR — no server, no hydration. Same major as
# botworkz/gander's gander-chat, so we benefit from any
# cross-project upgrades happening in that repo.
leptos = { version = "0.8", features = ["csr"] }

# Client-side routing under /admin/. We use leptos_router rather than
# rolling our own URL→component map so deep links work (the server
# falls back any unknown /admin/* path to index.html, and the SPA
# router takes over from there).
leptos_router = "0.8"

# WASM / JS interop. `web-sys` features stay minimal in v0; we only
# need `Window` for the `fetch` calls against api and `console`
# for `console_error_panic_hook`. Add more as new components require
# them.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Headers",
    "Window",
    "Request",
    "RequestInit",
    "Response",
    "console",
] }

# Route panics to the browser developer-tools console.
console_error_panic_hook = "0.1"

# JSON wire format for talking to api.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OPAQUE login client dependency is intentionally not wired yet in this
# repository clone: the canonical crate lives in botwork-extra and is not
# accessible here. See `src/pages/login.rs` TODO.

# shadcn/ui components (Leptos 0.8 compatible), imported per-component
# to keep the wasm bundle lean.
leptos-shadcn-alert = "=0.9.0"
leptos-shadcn-button = "=0.9.0"
leptos-shadcn-card = "=0.9.0"
leptos-shadcn-select = "=0.9.1"
leptos-shadcn-skeleton = "=0.9.0"
leptos-shadcn-table = "=0.9.0"

# NOTE: this crate intentionally does NOT inherit the workspace
# `[lints]` block (which sets `unsafe_code = "forbid"` for the rest
# of the workspace). `#[wasm_bindgen(start)]` and the leptos view!
# macros expand into code that the `unsafe_code` lint flags from the
# call-site crate; `forbid` is unconditional and cannot be downgraded
# by a downstream `#[allow]`, so opting out at the manifest level is
# the only knob we have. Hand-written `unsafe { }` blocks here are
# still expected to be caught in review — `grep -n unsafe src/`
# returns nothing today.

[profile.release]
# Keep the wasm crate on its own release profile instead of inheriting
# the parent workspace's native-binary settings. `strip = true`,
# `lto = true`, and `codegen-units = 1` in the shared root profile make
# LLVM emit bulk-memory ops (`memory.copy` / `memory.fill`) that
# trunk's bundled `wasm-opt -Oz` rejects unless it is given
# `--enable-bulk-memory`. Building `ui/wasm` from this standalone
# workspace preserves the native size optimisation on the service bins
# while keeping the wasm release build on its pre-PR profile.
panic = "abort"

# Separate workspace declaration so the parent workspace does not try
# to include this crate (the `members` list in the root Cargo.toml
# does not contain `ui/wasm`).
[workspace]
