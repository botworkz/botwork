[workspace]
resolver = "2"
members = [
    "api",
    "api-core",
    "auth-broker",
    "ui/server",
    "ui/wasm",
    "bootstrap",
    "cli",
    "config-broker",
    "control-plane",
    "db/entity",
    "db/migration",
    "launcher",
    "opaque-handshake",
    "session-broker",
    "ctl",
    "test-support",
    "vault",
    "version",
]

# Default set for bare `cargo build` / `cargo test` (no `--workspace`).
# Excludes `ui/wasm` because that crate only links against the
# `wasm32-unknown-unknown` target — building it for the host pulls in
# wasm-bindgen / web-sys against native, which is at best a long
# compile and at worst a hard link failure. CI exercises the wasm
# crate explicitly with `--target wasm32-unknown-unknown` and the
# container image builds it via `trunk build --release`.
default-members = [
    "api",
    "auth-broker",
    "ui/server",
    "bootstrap",
    "cli",
    "config-broker",
    "control-plane",
    "db/entity",
    "db/migration",
    "launcher",
    "session-broker",
    "ctl",
    "vault",
    "version",
]

# Workspace-wide lint policy. Inherited by every member crate via
# `[lints] workspace = true` in their `Cargo.toml`. The set is
# intentionally tiny:
#
# * `unsafe_code = "forbid"` — we don't write `unsafe` outside of
#   tests, full stop. `forbid` (vs `deny`) means a downstream
#   `#![allow(unsafe_code)]` cannot re-enable it; a future PR that
#   needs an `unsafe` block has to first change the policy here in a
#   stand-alone commit, which gets reviewed on its own merits.
#
# Any expansion belongs in a separate PR with its own justification —
# this block is a policy gate, not a style sheet.
[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[workspace.dependencies]
serial_test = "3"

# Release profile: size and optimisation settings for the shipped service
# binaries.  All changes here are compile-time only — no runtime decompression
# (deliberately NOT using UPX or similar; the services are long-lived daemons
# and are glibc-dynamic, so self-extracting compression would hurt cold start
# and increase RSS).
#
# panic = "abort"
#   Removes the stack unwinder and its libgcc_s.so.1 dependency, so binaries
#   run on distroless base-nossl-debian12 with no extra runtime libraries.
#   Server daemons are expected to die on panic and be restarted by systemd /
#   the container runtime.  Dev/debug builds keep the default unwind behaviour
#   for better diagnostics.
#
# strip = true
#   Strips debug symbols from the linked binary at link time.  Large, free size
#   win with zero runtime cost.
#
# lto = true
#   Enables full (fat) link-time optimisation across all codegen units.
#   Reduces dead code and inlining boundaries between crates.  Combined with
#   codegen-units = 1 this is the most effective compile-time size reduction
#   available without touching opt-level.
#
# codegen-units = 1
#   Compiles the whole crate graph as a single unit, giving LLVM the most
#   visibility for optimisation and dead-code elimination.  Comes at the cost
#   of build parallelism: release builds in CI (which share a cargo/target
#   cache with sharing=locked across service Dockerfiles) will be noticeably
#   slower.  That trade-off is accepted in exchange for smaller, better-
#   optimised binaries.
#
# opt-level is deliberately kept at the default (3).  These are
# latency-sensitive services (control-plane xDS streaming, brokers, launcher).
# A size-oriented opt-level ("s" or "z") may be worth benchmarking per-crate
# in the future, but is not enabled here to avoid throughput regressions.
[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
